anaTupleDef: AnaProd/anaTupleDef.py
histTupleDef: Analysis/histTupleDef.py
analysis_import: Analysis.hh_bbtautau
phys_model: BaseModel
use_cmssw_env_AnaTupleProduction: true

bundles:
  core:
    period_specific: false
    patterns:
      - FLAF
      - AnaProd
      - Analysis
      - config
      - env.sh
      - soft/flaf_env
      - HHbtag
      - Corrections
      - ClassicSVfit
      - SVfitTF
      - HHKinFit2
      - include
  cmssw:
    period_specific: false
    patterns:
      - soft/CMSSW_16_0_6
  inputFileList:
    period_specific: true
    patterns:
      - data/{version}/InputFileTask/{period}
    task_requires:
      module: FLAF.AnaProd.tasks
      class: InputFileTask
  AnaTupleFileList:
    period_specific: true
    patterns:
      - data/{version}/AnaTupleFileListBuilderTask/{period}
      - data/{version}/AnaTupleFileListTask/{period}
    task_requires:
      module: FLAF.AnaProd.tasks
      class: AnaTupleFileListBuilderTask
  inference:
    period_specific: false
    patterns:
      - inference
      - StatInference

WLCGFileSystem:
  remotePathCacheHost: cms-flaf.cern.ch
  remotePathCachePort: 5000
  localPathCacheValidity: 600
  verbose: 0

runTokenServer:
  host: cms-flaf.cern.ch
  port: 5007

nEventsPerFile:
  data: 1000000
  signals: 100000
  backgrounds: 100000

signal_types:
