fs_default:
  - /builds/cms-flaf/flaf_integration/output/HH_bbtautau

analysis_config_area: config
compute_unc_variations: true
compute_unc_histograms: true
store_noncentral: true

phys_model: TestModel
histTuple_flavor: CI

# The CI card, so the integration pipeline runs down to the limits (NonResonantLimitsTask):
# the non-resonant card's structure on the CI processes, one bin per channel and category.
# Replaces global.yaml's StatInference block in full.
StatInference:
  cards:
    CI: config/Datacards/CI/CI_card_nonres.yaml

# Exercise the ELReweighter signal trees in CI (the CI flavor keeps run/event/luminosityBlock).
# Replaces global.yaml's block in full.
signal_tree_hists_ELReweighter:
  store_signal_trees: true
  vars_to_store:
    - ggF_DNN_HH
  extra_vars_to_store:
    - mhh_lhe
    - pthh_lhe
    - costhetastar_lhe
    - run
    - event
    - luminosityBlock
    - weight_Central
