# The integration test runs one t#bar{t} and one DY dataset, each carrying the processors the
# analysis really uses for that process in this era. That is what exercises a stitcher over the
# whole anaTuple -> merge chain, where a gen-level input the anaTuple does not keep would
# otherwise only surface in production. One dataset per process is enough: each stitching bin's
# denominator is summed over the very events that later read it back, so a bin no event falls
# into is never divided by.
custom_CI_Background_TT:
  name: "CI -- Background t#bar{t}"
  color: "kGreen-3"
  processors: *TT_processors
  genInfo: [ TT ]
  datasets:
    - TTto2L2Nu

custom_CI_Background_DY:
  name: "CI -- Background DY"
  color: "kAzure+7"
  processors: *DYtautau_processors
  genInfo: [ DY, TauTau ]
  datasets:
    - DYto2Tau_M_50_2J_amcatnloFXFX

