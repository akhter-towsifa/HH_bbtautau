  name: "custom for CI and test purposes"
  color: "kAzure+10"
  datasets:
    - GluGlutoHHto2B2Tau_kl_0p00_kt_1p00_c2_0p00

custom_CI_Data:
  name: "CI -- Data"
  color: "kAzure+10"
  datasets:
    - Muon_Run2022D
