flaf:
  era: ${oc.env:FLAF_CWS_ERA}
  campaigns:
    Run3_2022: 2022preEE
    Run3_2022EE: 2022postEE
    Run3_2023: 2023preBPix
    Run3_2023BPix: 2023postBPix
    Run3_2024: '2024'

parameters:
  # <era>_<FLAF --version>, set by CWSTask
  version: ${oc.env:FLAF_CWS_VERSION}
  campaign: ${flaf.campaigns.${flaf.era}}
  model: model_nonres_hh_kappa
  model_options:
    - withoutProcesses=qqhh   # drop VBF (qqHH) unless VBF scaling is corrected
  # read by the tasks that take it (the limits and scans), skipped by the others
  use_initialfit: false

datacards:
  ggF_DNN_HH:
    # the era's cards as CreateDatacardsTask writes them (<fs_default>/<version>/Datacards/<era>),
    # mirrored to a local directory by CWSTask
    path: ${oc.env:FLAF_CWS_DATACARDS}/datacard_combined_signals.txt
    name: DNN Score
    campaign: ${parameters.campaign}

tasks:
  PlotUpperLimitsAtPoint:
    datacards: ggF_DNN_HH
    pois: r
    parameter_values: kl=1:kt=1
    show_parameters: kl,kt
    unblinded: false
    style: cms

  PlotUpperLimits:
    datacards: ggF_DNN_HH
    pois: r
    scan_parameters: { name: kl, min: -25, max: 25, points: 26 }
    show_parameters: kt
    unblinded: false
    style: cms
    save_ranges: true   # dump the allowed kl range (limit > 1) to a json
    y_log: true

  PlotUpperLimits2D:
    datacards: ggF_DNN_HH
    pois: r
    scan_parameters: [ { name: kl, min: -25, max: 25, points: 11 }, { name: kt, min: -5, max: 5, points: 11 } ]
    unblinded: false
    style: cms
    z_log: true

  PlotMultipleLikelihoodScans:
    datacards: ggF_DNN_HH
    pois: kl
    scan_parameters: { name: kl, min: -25, max: 25, points: 26 }
    show_parameters: kt
    save_ranges: true   # dump best-fit kl + 1/2-sigma interval to a json
    shift_negative_values: true
    recompute_best_fit: true
    show_points: true
    unblinded: false
    style: cms
