# The CI card (CI in ci_custom.yaml): the non-resonant card's structure on the CI sample set,
# so the integration pipeline runs histograms -> datacards -> limits.
#
# Same model, discriminant and channels as ../hh_bbtautau_run3_nonres.yaml, and its res2b
# category, but the processes of the CI physics model (TestModel in config/phys_models.yaml)
# and one bin per channel and category: at --test statistics anything finer is empty or
# negative.
analysis: hh_bbtautau
type: nonresonant
model:
  parameters: [ ]
  param_dependent_bkg: false
  input_file_pattern: ${ERA}/ggF_DNN_HH/ggF_DNN_HH.root
# the eras the integration pipeline runs (HH_bbtautau_eras in the trigger's variables)
eras:
  - Run3_2022
  - Run3_2022EE
  - Run3_2023
  - Run3_2023BPix
channels:
  - eTau
  - muTau
  - tauTau
# res2b only. At --test 1000 the CI backgrounds leave the Asimov data (their sum) of the
# other categories empty or negative in some channel and era -- boosted needs an AK8 fat jet,
# and tauTau/res1b came out at 0 (2023, 2023BPix) or -2.8 (2022EE, from DY's negative
# weights) -- and the datacard step refuses such a histogram.
categories:
  - res2b
input_categories:
  res2b: OS_Iso/res2b
# one bin over the whole DNN score range
hist_bins: [ 0.0, 1.0 ]
signalFractionForRelevantBins: 0.2
keep_all_signal_hypothesis_into_single_datacard: true
# The limit step (NonResonantLimitsTask) passes text2workspace --X-allow-no-background: a
# channel x category whose Asimov data is empty (see data_obs below) has no background, which
# combine refuses otherwise.
allow_no_background: true
processes:
  # The Asimov data is the sum of the backgrounds, which at --test 1000 can be empty in a
  # channel x category of some era (tauTau/res2b in Run3_2023 and Run3_2023BPix: no CI
  # background event passes there). Accepted rather than dropping the era or channel: the CI
  # runs the whole pipeline over every era, and its limit is not meant to be meaningful.
  - process: data_obs
    is_data: true
    is_asimov_data: true
    allow_zero_integral: true
  # the CI signal sample (GluGlutoHHto2B2Tau kl=0); may be empty in a category at --test
  # statistics, and the category is then left without signal
  - process: custom_CI_Signal
    is_signal: true
    allow_zero_integral: true
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2
  - process: custom_CI_Background_TT
    allow_zero_integral: true
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2
  # amc@NLO: its negative weights need not cancel at --test 1000
  - process: custom_CI_Background_DY
    allow_zero_integral: true
    allow_negative_integral: true
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 10

uncertainties:
  # the luminosity uncertainties of ../hh_bbtautau_run3_nonres.yaml
  - name: lumi_1
    type: lnN
    eras:
      - Run3_2022
      - Run3_2022EE
    value: 0.0138
  - name: lumi_2
    type: lnN
    eras:
      - Run3_2023
      - Run3_2023BPix
    value: 0.0127

autolnNThr: 0.1
asymlnNThr: 0.001
ignorelnNThr: 0.001
autoMCStats:
  apply: true
  threshold: 20
  apply_to_signal: true
  mode: 1
